[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vclab"
version = "0.1.0"
description = "Voice cloning lab: record, fine-tune and synthesize with Coqui XTTS-v2"
requires-python = ">=3.10,<3.13"
dependencies = [
  "coqui-tts>=0.24",
  "torch>=2.2",
  "torchaudio>=2.2",
  "faster-whisper>=1.0",
  "gradio>=4.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "soundfile>=0.12",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vclab-infer = "vclab.infer:main"
vclab-webui = "vclab.webui:main"
vclab-train = "vclab.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
